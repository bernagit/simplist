# Static Starlight site, served under /docs/ (astro.config.ts: base '/docs'), so the instance's
# proxy can pass requests through as they are (docker/nginx/simplist.conf)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # Relative redirects: keep the scheme and port the browser used (HTTPS proxy in front)
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = / {
    return 302 /docs/;
  }

  location /docs/ {
    try_files $uri $uri/ $uri.html =404;
  }

  # Hashed build assets never change
  location /docs/_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  error_page 404 /docs/404.html;
}
