services:
  db:
    image: postgres:17

    restart: unless-stopped
    container_name: simplist-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simplist
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile

    depends_on:
      db:
        condition: service_healthy
    container_name: simplist-api
    ports:
      - "2000:2000"

    env_file:
      - ./apps/api/.env
    volumes:
      - ./keys:/app/keys:ro

  app:
    build:
      context: .
      dockerfile: ./apps/app/Dockerfile

    depends_on:
      - api
    container_name: simplist-app
    ports:
      - "3000:3000"

    env_file:
      - ./apps/app/.env

    environment:
      NODE_ENV: production
volumes:
  postgres_data: