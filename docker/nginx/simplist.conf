# Single entry point: the web app and the API share one origin.
#   /api/* -> Express API (simplist-api:2000), path kept as is (the API mounts its routes on /api)
#   /*     -> Next.js app (simplist-app:3000)
# TLS is expected to be terminated in front of this (host nginx, Caddy, Traefik, Cloudflare...).

# Keep the scheme set by an outer TLS proxy; fall back to ours when there is none
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

upstream simplist_api {
  server simplist-api:2000;
}

upstream simplist_app {
  server simplist-app:3000;
}

server {
  listen 80;
  server_name _;

  # Avatars are sent as data URIs in JSON bodies
  client_max_body_size 5m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;

  location /api/ {
    proxy_pass http://simplist_api;
  }

  location / {
    proxy_pass http://simplist_app;
  }
}
