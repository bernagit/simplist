# Single entry point of a Simplist instance, built into the simplist-proxy image (Dockerfile):
#   /api/*   -> Express API (api:2000), path kept as is (routes are mounted on /api)
#   /docs/*  -> documentation (docs:80), only with the "docs" profile; otherwise a redirect
#               to the documentation sources on GitHub
#   /*       -> Next.js app (app:3000)
# TLS is expected to be terminated in front of this (host nginx, Caddy, Traefik, Cloudflare...).

# Keep the scheme set by an outer TLS proxy; fall back to ours when there is none
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

upstream simplist_api {
  server api:2000;
}

upstream simplist_app {
  server app:3000;
}

server {
  listen 80 default_server;
  server_name _;

  # Relative redirects: keep the scheme and port the browser used (HTTPS proxy in front)
  absolute_redirect off;

  # Avatars are sent as data URIs in JSON bodies
  client_max_body_size 5m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;

  location /api/ {
    proxy_pass http://simplist_api;
  }

  # The docs service is optional: resolve it per request (Docker's DNS), so nginx starts
  # without it, and send visitors to the sources on GitHub when it isn't running
  location = /docs {
    return 301 /docs/;
  }

  location /docs/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $docs_upstream http://docs:80;
    proxy_pass $docs_upstream;
    error_page 502 503 504 = @docs_unavailable;
  }

  location @docs_unavailable {
    return 302 https://github.com/bernagit/simplist/tree/master/apps/docs/src/content/docs;
  }

  location / {
    proxy_pass http://simplist_app;
  }
}
