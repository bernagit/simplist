services:
  api:
    container_name: simplist-api
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../apps/api/.env
    environment:
      POSTGRES_HOST: simplist-db
    volumes:
      # Secrets created on first start (session and push keys): writable, and keep it in backups
      - ../keys:/app/keys

  app:
    container_name: simplist-app
    build:
      context: ..
      dockerfile: apps/app/Dockerfile
    depends_on:
      api:
        condition: service_started
    env_file:
      - ../apps/app/.env
    environment:
      NODE_ENV: production

  docs:
    container_name: simplist-docs
    build:
      context: ..
      dockerfile: apps/docs/Dockerfile

  # Only public entry point: docs.* -> docs, /api -> api, everything else -> app
  # (see nginx/simplist.conf)
  nginx:
    container_name: simplist-nginx
    image: nginx:1.27-alpine
    depends_on:
      - api
      - app
      - docs
    ports:
      - "3000:80"
    volumes:
      - ./nginx/simplist.conf:/etc/nginx/conf.d/default.conf:ro