services:
  api:
    container_name: simplist-api
    image: ${REGISTRY}/simplist-api:${VERSION}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ../keys:/app/keys:ro

  app:
    container_name: simplist-app
    image: ${REGISTRY}/simplist-app:${VERSION}
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production

  docs:
    container_name: simplist-docs
    image: ${REGISTRY}/simplist-docs:${VERSION}

  # Only public entry point: docs.* -> docs, /api -> api, everything else -> app
  # (see nginx/simplist.conf)
  nginx:
    container_name: simplist-nginx
    image: nginx:1.27-alpine
    depends_on:
      - api
      - app
      - docs
    ports:
      - "3000:80"
    volumes:
      - ./nginx/simplist.conf:/etc/nginx/conf.d/default.conf:ro