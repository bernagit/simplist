services:
  api:
    container_name: simplist-api
    image: ${REGISTRY}/simplist-api:${VERSION}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "2000:2000"
    env_file:
      - .env
    volumes:
      - ../keys:/app/keys:ro

  app:
    container_name: simplist-app
    image: ${REGISTRY}/simplist-app:${VERSION}
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      API_URL: http://simplist-api:2000/api